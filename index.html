<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airin Profile 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet" />-

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #91ffb2;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: stretch;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 40px 20px;
            flex: 1;
            overflow-y: auto;
        }

        .sec-1 {
            width: calc(48% - 10px);
            display: flex;
            flex-direction: column;
        }

        .sec-1 h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            margin-bottom: 20px;
            line-height: 1.2;
            font-weight: 700;
        }

        .sec-1 p {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 90%;
        }

        .btn-follow {
            background-color: #2c2c2c;
            color: #ffffff;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: fit-content;
            transition: opacity 0.3s ease;
            margin-bottom: 30px;
        }

        .btn-follow:hover {
            opacity: 0.8;
        }

        .bottom-cards {
            display: flex;
            gap: 20px;
            margin-top: auto;
            width: 100%;
            height: 35%;
        }

        .img-link {
            display: block;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .img-link:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .card-iframe,
        .mockup-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 400%;
            height: 400%;
            transform: scale(0.25);
            transform-origin: top left;
            border: none;
            pointer-events: none;
        }

        .sec-2,
        .sec-3 {
            width: calc(24% - 10px);
            display: flex;
            justify-content: center;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #333;
            background-color: #91ffb2;
        }

        .footer p {
            margin: 4px 0;
        }

        @media (max-width: 992px) {

            html,
            body {
                overflow: auto;
                height: auto;
            }

            .hero {
                padding: 40px 20px;
                overflow-y: visible;
            }

            .sec-1,
            .sec-2,
            .sec-3 {
                width: 100%;
                margin-bottom: 30px;
            }

            .sec-1 p {
                max-width: 100%;
            }

            .bottom-cards {
                margin-top: 40px;
                height: 250px;
            }

            .sec-2 .img-link,
            .sec-3 .img-link {
                height: 400px;
            }
        }
    </style>
</head>

<body>
    <div class="hero">

        <div class="sec-1">
            <h1>My Web Design by <br>HTML CSS</h1>
            <p>Lorem ipsum dolor sit amet,<br>consectetur adipiscing elit.<br>Cursus imperdiet sed id elementum.<br>Quam
                vel aliquam sit vulputate.</p>
            <button class="btn-follow">Follow Me</button>

            <div class="bottom-cards">
                <a href="page_a.html" target="_blank" class="img-link" style="flex: 1;"
                    title="ดูหน้า Freelance Web Developer">
                    <iframe src="page_a.html" class="card-iframe" scrolling="no"></iframe>
                </a>
                <a href="page_b.html" target="_blank" class="img-link" style="flex: 1;" title="ดูหน้า Profile Partner">
                    <iframe src="page_b.html" class="card-iframe" scrolling="no"></iframe>
                </a>
            </div>
        </div>

        <div class="sec-2">
            <a href="page_c.html" target="_blank" class="img-link" style="width: 100%;" title="ดูหน้า Portfolio UI">
                <iframe src="page_c.html" class="mockup-iframe" scrolling="no"></iframe>
            </a>
        </div>

        <div class="sec-3">
            <a href="page_d.html" target="_blank" class="img-link" style="width: 100%;" title="ดูหน้า Bake House">
                <iframe src="page_d.html" class="mockup-iframe" scrolling="no"></iframe>
            </a>
        </div>
    </div>

    <div class="footer">
        <p>(เว็บไซต์และผลงานทั้งหมดใช้เพื่อการศึกษาเท่านั้น)</p>
        <p>Created by Airin SAU</p>
        <p>Copyright &copy; 2026 WoW WoW WoW </p>
    </div>
</body>

</html>
