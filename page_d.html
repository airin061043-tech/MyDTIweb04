<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airin COFFEE SHOP - Bakery Website</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sansita+Swashed:wght@300..900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-brown: #8c4126;
      --primary-hover: #72321b;
      --text-dark: #2b2b2b;
      --text-light: #ffffff;
      --text-accent: #e5b382;
      --bg-light: #ffffff;
      --bg-dark: #121212;
      --font-heading: 'Sansita Swashed', cursive;
      --font-serif: 'Inter', sans-serif;
      --font-sans: 'Inter', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-dark);
      background-color: var(--bg-light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 3.8rem;
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 25px;
      font-weight: 400;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .hero-section {
      position: relative;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 50px 80px 50px;
      overflow: hidden;
    }

    .hero-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55));
      z-index: 2;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 10;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-accent);
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.03);
    }

    .logo-icon {
      width: 34px;
      height: auto;
      margin-bottom: 4px;
    }

    .logo-text {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e5b382;
      line-height: 1;
    }

    .logo-subtext {
      font-size: 0.55rem;
      letter-spacing: 2px;
      color: #c5a880;
      margin-top: 3px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 35px;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--text-accent);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text-accent);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .hero-content {
      max-width: 650px;
      margin-top: auto;
      margin-bottom: auto;
      padding-top: 50px;
      position: relative;
      z-index: 10;
    }

    .hero-subtitle {
      color: var(--text-accent);
      font-size: 1.35rem;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: 5.2rem;
      line-height: 1.15;
      color: #ffffff;
      margin-bottom: 35px;
      font-weight: 400;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .btn-shop {
      background-color: var(--primary-brown);
      color: #ffffff;
      padding: 13px 38px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(140, 65, 38, 0.3);
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-shop:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(140, 65, 38, 0.45);
    }

    .btn-learn {
      color: var(--text-accent);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    .btn-learn:hover {
      color: #ffffff;
      opacity: 0.9;
    }

    .top-products-section {
      background-color: var(--bg-light);
      padding: 80px 0 0 0;
      text-align: center;
    }

    .image-block {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 60px auto;
      padding: 0 20px;
    }

    .image-block img {
      width: 100%;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    }

    .full-width-banner img {
      width: 100%;
      display: block;
    }

    .explore-section {
      background-color: var(--bg-light);
      padding: 80px 0 0 0;
      text-align: center;
    }

    .category-tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      list-style: none;
      margin-bottom: 45px;
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 15px;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
    }

    .category-tabs li a {
      text-decoration: none;
      color: #666666;
      font-weight: 500;
      font-size: 1rem;
      padding-bottom: 12px;
      position: relative;
      transition: color 0.3s ease;
    }

    .category-tabs li.active a,
    .category-tabs li a:hover {
      color: #2b2b2b;
      font-weight: 600;
    }

    .category-tabs li.active a::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--primary-brown);
      border-radius: 2px;
    }

    .featured-section {
      background-color: var(--bg-light);
      padding: 80px 0 90px 0;
      text-align: center;
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
      max-width: 1100px;
      margin: 40px auto 0 auto;
      padding: 0 20px;
    }

    .featured-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      transition: transform 0.3s ease;
    }

    .featured-card:hover {
      transform: translateY(-5px);
    }

    .featured-card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .featured-card-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 4px;
    }

    .featured-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .featured-card-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .footer-section {
      width: 100%;
      background-color: var(--bg-dark);
      line-height: 0;
    }

    .footer-section img {
      width: 100%;
      display: block;
    }
 
  </style>
</head>
<body>

  <section class="hero-section">
    <img class="hero-bg-img" src="./images/D1.png" onerror="this.src='https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1920&q=80'" alt="Hero Background">
    
    <header class="navbar">
      <div class="logo">
        <img src="./images/logoD.png" alt="" />
      </div>
        <a href="#" class="logo">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Services</a></li>
        </ul>
      </nav>
    </header>

    <div class="hero-content">
      <p class="hero-subtitle">Delicious Cafe</p>
      <h1 class="hero-title">Sweet Treats,<br>Perfect Eats</h1>
      <div class="hero-buttons">
        <a href="#" class="btn-shop">Shop Now</a>
        <a href="#" class="btn-learn">Learn More</a>
      </div>
    </div>
  </section>

  <section class="top-products-section">
    <h2 class="section-title">Top Products</h2>
    
    <div class="image-block">
      <img src="./images/D2.png" onerror="this.src='https://images.unsplash.com/photo-1608198093002-ad4e005484ec?auto=format&fit=crop&w=1200&q=80'" alt="Top Products Grid">
    </div>

    <div class="full-width-banner">
      <img src="./images/D3.png" onerror="this.src='https://images.unsplash.com/photo-1549931319-a545dcf3bc73?auto=format&fit=crop&w=1400&q=80'" alt="20% Off Your First Order Banner">
    </div>
  </section>


  <section class="explore-section">
    <h2 class="section-title">Explore More</h2>

    <div class="image-block" style="margin-bottom: 30px;">
      <img src="./images/D10.png" onerror="this.src='https://placehold.co/800x60/8c4126/ffffff?text=Cake+%7C+Muffins+%7C+Croissant+%7C+Bread+%7C+Tart+%7C+Favorite'" alt="Explore Categories Menu">
    </div>

    <div class="image-block">
      <img src="./images/D4.png" onerror="this.src='https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=1200&q=80'" alt="Explore More Gallery Grid">
    </div>

    <div class="full-width-banner">
      <img src="./images/D5.png" onerror="this.src='https://images.unsplash.com/photo-1511018556340-d16986a1c194?auto=format&fit=crop&w=1400&q=80'" alt="About Us Banner">
    </div>
  </section>


  <section class="featured-section">
    <h2 class="section-title">Featured Treats</h2>

    <div class="featured-grid">
      <div class="featured-card">
        <img src="./images/D6.png" onerror="this.src='https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80'" alt="Puff Pastry" class="featured-card-img">
        <div class="featured-card-info">
          <span class="featured-card-title">Puff Pastry</span>
          <span class="featured-card-price">8 Baht</span>
        </div>
      </div>

      <div class="featured-card">
        <img src="./images/D7.png" onerror="this.src='https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?auto=format&fit=crop&w=600&q=80'" alt="Doughnuts" class="featured-card-img">
        <div class="featured-card-info">
          <span class="featured-card-title">Doughnuts</span>
          <span class="featured-card-price">8 Baht</span>
        </div>
      </div>

      <div class="featured-card">
        <img src="./images/D8.png" onerror="this.src='https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=600&q=80'" alt="Brownies" class="featured-card-img">
        <div class="featured-card-info">
          <span class="featured-card-title">Brownies</span>
          <span class="featured-card-price">8 Baht</span>
        </div>
      </div>
    </div>
  </section>


  <footer class="footer-section">
    <!-- Full-width Footer Image -->
    <img src="./images/D9.png" onerror="this.src='https://images.unsplash.com/photo-1517433670267-08bbd4be890f?auto=format&fit=crop&w=1600&q=80'" alt="Bakery Footer Information">
  </footer>


  <script>
    function switchTab(event, element) {
      event.preventDefault();
      const tabs = document.querySelectorAll('#categoryTabs li');
      tabs.forEach(tab => tab.classList.remove('active'));
      element.parentElement.classList.add('active');
    }
  </script>
</body>
</html>
